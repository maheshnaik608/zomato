 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Food Delivery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f8;
            color: #333;
        }

        header {
            background: #e23744;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-size: 16px;
        }

        .hero {
            text-align: center;
            padding: 65px 20px;
            color: white;
            background: linear-gradient(#0007, #0007),
                url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80")
                center/cover;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 19px;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input {
            width: min(430px, 90%);
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-box button {
            background: #e23744;
            color: white;
            padding: 14px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .container h2 {
            margin-bottom: 22px;
            font-size: 27px;
        }

        .categories {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .category {
            background: white;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            min-width: 140px;
            text-align: center;
            box-shadow: 0 2px 8px #0001;
            font-size: 18px;
        }

        .category span {
            display: block;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .restaurants {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px #0001;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .card-content {
            padding: 16px;
        }

        .card-content h3 {
            margin-bottom: 10px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            color: #666;
            font-size: 14px;
        }

        .rating {
            background: #267e3e;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            font-weight: bold;
        }

        .add-btn {
            width: 100%;
            background: #e23744;
            color: white;
            padding: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #bf1f30;
        }

        .cart {
            background: white;
            margin-top: 35px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
        }

        .cart h2 {
            margin-bottom: 15px;
        }

        #cart-items {
            line-height: 2;
            margin-bottom: 10px;
        }

        .checkout {
            background: #267e3e;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background: #222;
            color: white;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">zomato</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#restaurants">Restaurants</a>
        <a href="#cart">My Cart (<span id="cart-count">0</span>)</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Discover the best food near you</h1>
    <p>Order delicious food from your favourite restaurants</p>
    <div class="search-box">
        <input type="text" id="search"
               placeholder="Search restaurants or food...">
        <button onclick="searchFood()">Search</button>
    </div>
</section>

<main class="container">
    <h2>Explore Categories</h2>

    <div class="categories">
        <div class="category"><span>🍕</span>Pizza</div>
